<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14060c">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>For Aynaz ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><div id="floaters"></div></div>
  <button id="musicBtn" class="icon-btn" type="button" aria-pressed="false" aria-label="Play music" title="Music on/off">♪</button>
  <main id="app">
    <section id="welcome" class="screen active">
      <div class="card center">
        <div class="big-heart" aria-hidden="true">
          <svg viewBox="0 0 32 29" width="120" height="108"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3cb"/><stop offset="1" stop-color="#f06a98"/></linearGradient></defs><path fill="url(#hg)" d="M23.6 0c-3.4 0-5.9 1.7-7.6 4.2C14.3 1.7 11.8 0 8.4 0 3.7 0 0 3.7 0 8.5c0 9.6 16 20.5 16 20.5s16-10.9 16-20.5C32 3.7 28.3 0 23.6 0z"/></svg>
        </div>
        <h1 id="welcomeTitle"></h1><p id="welcomeSub" class="sub"></p>
        <button id="startBtn" class="btn primary" type="button"></button>
      </div>
    </section>
    <section id="quiz" class="screen">
      <div class="card">
        <div id="progress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-label="Quiz progress"></div>
        <p id="qCount" class="count"></p><h2 id="qText"></h2>
        <div id="options" class="options" role="group" aria-labelledby="qText"></div>
        <p id="reply" class="reply" aria-live="polite"></p>
        <div class="nav"><button id="prevBtn" class="btn ghost" type="button">Previous</button><button id="nextBtn" class="btn primary" type="button" disabled>Next</button></div>
      </div>
    </section>
    <section id="result" class="screen">
      <div class="card center"><div class="big-heart beat" aria-hidden="true"><svg viewBox="0 0 32 29" width="110" height="100"><path fill="url(#hg)" d="M23.6 0c-3.4 0-5.9 1.7-7.6 4.2C14.3 1.7 11.8 0 8.4 0 3.7 0 0 3.7 0 8.5c0 9.6 16 20.5 16 20.5s16-10.9 16-20.5C32 3.7 28.3 0 23.6 0z"/></svg></div><h2 id="resultTitle"></h2><p id="resultMsg" class="message"></p><button id="lastBtn" class="btn primary" type="button"></button></div>
    </section>
    <section id="letter" class="screen"><div class="card paper"><h2 id="letterTitle"></h2><div id="letterBody" class="letter-body"></div><p id="letterSign" class="sign"></p><button id="finalBtn" class="btn primary" type="button"></button></div></section>
    <section id="end" class="screen"><div class="card center"><div class="big-heart beat" aria-hidden="true"><svg viewBox="0 0 32 29" width="90" height="82"><path fill="url(#hg)" d="M23.6 0c-3.4 0-5.9 1.7-7.6 4.2C14.3 1.7 11.8 0 8.4 0 3.7 0 0 3.7 0 8.5c0 9.6 16 20.5 16 20.5s16-10.9 16-20.5C32 3.7 28.3 0 23.6 0z"/></svg></div><h2 id="endTitle"></h2><p id="endMsg" class="sub"></p><button id="replayBtn" class="btn ghost" type="button">Replay from the start</button></div></section>
  </main>
  <div id="cursor" aria-hidden="true">♥</div><p id="note" class="note" role="status"></p>
  <script src="script.js"></script>
</body>
</html>
